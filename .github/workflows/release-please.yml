name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      # Keep the registry URL but remove setup-node's placeholder authentication.
      - name: Enable npm OIDC trusted publishing
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = process.env.NPM_CONFIG_USERCONFIG;
            writeFileSync(path, readFileSync(path, "utf8").split("\n").filter(line => !line.includes(":_authToken=")).join("\n"));
          '
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@knowttl/vectra-axi@$version" version > /dev/null 2>&1; then
            echo "@knowttl/vectra-axi@$version is already published; skipping."
          else
            npm publish --access public --provenance
          fi
